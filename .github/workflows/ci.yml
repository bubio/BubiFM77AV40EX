name: CI

# 品質ゲート（書式・解析・テスト）とネイティブコアの検査。
# 対象ファイルだけで起動し、他のワークフローやドキュメントの変更では走らせない。
# 配布物のビルドは build-*.yml が受け持つ。
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'native/**'
      - 'packages/**'
      - 'tool/**'
      - 'assets/**'
      - 'shaders/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
      - '.fvmrc'
      - 'flutter_launcher_icons.yaml'
      # アイコン再生成の差分検査が見る生成物
      - 'macos/Runner/Assets.xcassets/**'
      - 'windows/runner/resources/**'
      - 'scripts/check.sh'
      - 'scripts/build_native_core.sh'
      - 'scripts/run_native_checks.sh'
      - '.github/actions/setup-fvm/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'native/**'
      - 'packages/**'
      - 'tool/**'
      - 'assets/**'
      - 'shaders/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
      - '.fvmrc'
      - 'flutter_launcher_icons.yaml'
      # アイコン再生成の差分検査が見る生成物
      - 'macos/Runner/Assets.xcassets/**'
      - 'windows/runner/resources/**'
      - 'scripts/check.sh'
      - 'scripts/build_native_core.sh'
      - 'scripts/run_native_checks.sh'
      - '.github/actions/setup-fvm/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: format / analyze / test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      # SDKの取得はFVMへ一本化する。版は .fvmrc を正とする。
      - uses: ./.github/actions/setup-fvm

      # ローカルと同じ入口を呼ぶ（development_plan.md 11.1）
      - name: Quality gate
        run: ./scripts/check.sh

      # 正本PNGから再生成したmacOS/Windowsのアイコンに差分がないことを確かめる。
      # 正本は正式素材へ差し替え済みのため、暫定画像の生成スクリプトは使わない。
      - name: Verify app icon is reproducible from its source PNG
        run: |
          fvm dart run flutter_launcher_icons
          git diff --exit-code

  native-core:
    name: native core build / smoke test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      # .gitmodules はSSHで記述しているが、CIには鍵がない。
      # コアのリポジトリは公開のため、取得URLだけをHTTPSへ読み替える。
      # .gitmodules 自体は変更しない。
      - name: Use HTTPS for submodule fetch
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # コアだけを取得する（docs/dev は非公開サブモジュールのため取得しない）。
      - name: Fetch pinned emulation core
        run: ./scripts/build_native_core.sh fetch

      # 固定リビジョンかつ無改変（未追跡ファイルも含む）であることを検査する。
      - name: Verify core is unmodified
        run: ./scripts/build_native_core.sh verify

      - name: Build core and minimal host
        run: ./scripts/build_native_core.sh build

      # ROMを必要としない最小ホスト。EMU/VMの生成・リセット・破棄だけを見る。
      - name: Run core smoke test
        run: ./scripts/build_native_core.sh test

      # Dart FFI 検証に必要。
      - uses: ./.github/actions/setup-fvm

      # 製品用C ABIのリーク検査とDart FFI検証（development_plan.md 6 WP1）。
      # leaks(1) はサンドボックスで応答しないことがあるため時間制限付きで実行し、
      # 計測できない場合は未実施として続行する（検出0とは扱わない）。
      - name: Run native ABI checks
        run: ./scripts/run_native_checks.sh
        timeout-minutes: 10
        env:
          # 対話的な問い合わせでステップが止まらないようにする。
          CI: true
          FLUTTER_SUPPRESS_ANALYTICS: true

      - name: Collect core license inventory
        run: ./scripts/build_native_core.sh licenses
