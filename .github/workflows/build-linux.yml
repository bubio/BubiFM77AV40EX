name: Build Linux (amd64/arm64 DEB/RPM/AppImage)

# アプリのビルド結果に影響するファイルだけで起動する。
# 他のワークフローやドキュメント、テストだけの変更では走らせない。
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'native/**'
      - 'packages/**'
      - 'assets/**'
      - 'shaders/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'l10n.yaml'
      - '.fvmrc'
      - 'LICENSE'
      - 'tool/collect_licenses.dart'
      - 'linux/**'
      - 'scripts/build_native_core.sh'
      - 'scripts/generate_license_list.sh'
      - 'scripts/build_linux.sh'
      - 'scripts/package_linux.sh'
      - '.github/actions/setup-fvm/**'
      - '.github/workflows/build-linux.yml'
      - '.github/workflows/publish-release-assets.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'native/**'
      - 'packages/**'
      - 'assets/**'
      - 'shaders/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'l10n.yaml'
      - '.fvmrc'
      - 'LICENSE'
      - 'tool/collect_licenses.dart'
      - 'linux/**'
      - 'scripts/build_native_core.sh'
      - 'scripts/generate_license_list.sh'
      - 'scripts/build_linux.sh'
      - 'scripts/package_linux.sh'
      - '.github/actions/setup-fvm/**'
      - '.github/workflows/build-linux.yml'
      - '.github/workflows/publish-release-assets.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  build:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Flutterはクロスビルドできないため、各アーキテクチャのランナーで作る。
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Use HTTPS for submodule fetch
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libasound2-dev \
            liblzma-dev \
            libstdc++-12-dev \
            imagemagick \
            desktop-file-utils \
            rpm

      - uses: dart-lang/setup-dart@v1
      - uses: ./.github/actions/setup-fvm

      - name: Build
        run: ./scripts/build_linux.sh release

      - name: Package DEB/RPM/AppImage
        run: ./scripts/package_linux.sh

      # CIの成果物は版なし（BubiFM77AV40EX-<platform>-<arch>.<ext>）、
      # リリースは版付き（BubiFM77AV40EX-<version>-<platform>-<arch>.<ext>）にする。
      - name: Drop the version from CI artifact names
        if: github.event_name != 'release'
        shell: bash
        run: |
          VERSION="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d '+' -f1)"
          for f in build/linux/dist/*; do
            mv "$f" "${f/-${VERSION}-/-}"
          done

      # archive: false でzipに包まず1ファイルずつ上げる（成果物名はファイル名になる）。
      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          path: build/linux/dist/*.deb
          archive: false
          if-no-files-found: error

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          path: build/linux/dist/*.rpm
          archive: false
          if-no-files-found: error

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          path: build/linux/dist/*.AppImage
          archive: false
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'release'
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release-assets.yml
    with:
      asset-patterns: |
        *.deb
        *.rpm
        *.AppImage
