name: bubifm77av40ex
description: "FM77AV40EX emulator front-end built on the Common Source Code Project core."
publish_to: 'none'

# セマンティックバージョニング。P0プレビューは0.x、P1完成版で1.0.0とする。
# ビルド番号は1からの連番。
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # C ABI呼び出し（lib/platform/core_ffi/）
  ffi: 2.2.0
  # 無改変エミュレーションコアのFFIプラグイン（design.md 16.1）。
  # ビルド定義の正は native/CMakeLists.txt にある。
  bubifm77av40ex_core:
    path: packages/bubifm77av40ex_core
  # 状態管理・依存注入（BluePrint 技術スタック）
  flutter_riverpod: 3.4.2
  # エミュレーター音声出力（BluePrint 技術スタック）
  flutter_soloud: 4.1.7
  intl: 0.20.3
  # 承認済みmanifestとのSHA-256照合（specification.md 6）。
  # Dart SDKにハッシュ実装がないため使う。
  crypto: 3.0.7
  # OS標準の保存領域（design.md 11.3）。~/Library/Application Support と
  # ~/Library/Caches をOS APIから得る。
  path_provider: 2.1.6
  # PreferencesStore の実体。macOSでは NSUserDefaults を使う（design.md 11.2）。
  shared_preferences: 2.5.5
  # ROMディレクトリと媒体の選択ダイアログ。Flutter公式パッケージ。
  file_selector: 1.1.0
  # 利用者が選んだ位置への永続アクセス権（security-scoped bookmark）。
  # macOSのブックマークAPIを扱う自前のプラグイン。
  bubifm77av40ex_platform:
    path: packages/bubifm77av40ex_platform
  # 物理ジョイスティック/ゲームパッド入力（INP-04）。macOS/iOSは内部で
  # GameController.frameworkを使う。自前のSwiftプラットフォームチャンネルは
  # 作らない（design.md「ジョイスティック割当（M3、INP-04）の実装方式」）。
  gamepads: 0.1.11
  # ウィンドウ倍率変更（design.md 12.2 `Host > Screen > Window x1 / x2 / …`）。
  # macOS/Windows/Linuxのデスクトップウィンドウ操作を統一APIで扱う既製
  # パッケージを使い、gamepads採用時と同じ理由で自前のSwift/C++実装は
  # 増やさない。
  window_manager: 0.5.2
  # 上記のウィンドウ倍率の上限を決めるための、現在のディスプレイ作業領域
  # 取得に使う（window_managerの推移的依存を明示化）。
  screen_retriever: 0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: 1.3.3
  flutter_lints: 6.0.0
  # design.md 15.3 でバージョンを固定
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
  # ホスト側の走査線・RGBフィルター効果（VID-04）。design.md 16.1参照。
  shaders:
    - shaders/scanline.frag
    - shaders/rgb_filter.frag
