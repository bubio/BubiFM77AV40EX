name: bubi_fm77av40ex_core
description: "FFI bindings to the unmodified eFM77AV40EX emulation core (native/)."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: 2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  plugin:
    # エミュレーターの操作はDartから直接ネイティブを呼ぶ（ffiPlugin）。
    # 映像だけは別で、Flutterの Texture へ渡すために Swift 側の
    # 登録が要るため pluginClass も持つ（design.md 16.1）。
    # macOS以外はM4〜M6で各マイルストーンの担当時に追加する。
    # 動かせないOSの定義を先に置かない。
    platforms:
      macos:
        ffiPlugin: true
        pluginClass: BubiFm77Av40ExCorePlugin
