name: bubifm77av40ex_platform
description: "OS platform services that Flutter packages do not cover (security-scoped bookmarks)."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider_windows: 2.3.0
  # LinuxのPictures/Music（xdg-user-dir）。path_providerのLinux実装も
  # 使うFlutter公式パッケージ（推移的依存の明示化）。
  xdg_directories: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  plugin:
    # macOS/Windows以外はM6で担当時に追加する。Linuxは正規化パス、Androidは
    # SAFの永続URI権限になる（design.md 9）。
    platforms:
      macos:
        pluginClass: BubiFm77Av40ExPlatformPlugin
      # クライアント領域（ウィンドウの枠を除いた中身）を直接指定して
      # ウィンドウを操作するチャンネルだけを持つ（design.md「x1ウィンドウの
      # 大きさの調査」）。`window_manager`にはWindowsでクライアント領域を
      # 指定するAPIがないための自前実装（design.mdへ理由を記録）。
      windows:
        pluginClass: BubiFm77Av40ExPlatformPlugin
